<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习辅助工具设置</title>
  <style>
    body { max-width: 720px; margin: 32px auto; padding: 0 18px; font: 14px/1.6 system-ui, sans-serif; color: #222; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; }
    button { margin-top: 18px; padding: 8px 16px; cursor: pointer; }
    .hint { color: #666; font-size: 12px; }
    #status { margin-left: 10px; color: #1677ff; }
  </style>
</head>
<body>
  <h1>学习辅助工具</h1>
  <p class="hint">此页面替代油猴脚本的部分配置存储。视频脚本“浪浪不想看”会在指定课程页面自动运行。</p>
  <label for="token">题库 token</label><input id="token" type="text" autocomplete="off">
  <label for="rate">视频倍速</label><input id="rate" type="number" min="0.1" max="16" step="0.1">
  <label for="review">章节测试模式</label><select id="review"><option value="0">关闭</option><option value="1">复习模式</option></select>
  <label><input id="doWork" type="checkbox"> 自动处理章节任务</label>
  <label><input id="autoSave" type="checkbox"> 自动保存</label>
  <label><input id="autoSubmit" type="checkbox"> 自动提交</label>
  <button id="save">保存</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
